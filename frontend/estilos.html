
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estilos — Estúdio de Tatuagem</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body class="container py-4">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Estúdio de Tatuagem</span>

      <div>
        <a href="clientes.html" class="text-light me-3">Clientes</a>
        <a href="senioridade.html" class="text-light me-3">Senioridade</a>
        <a href="estilos.html" class="text-light me-3">Estilos</a>
        <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
        <a href="agendamentos.html" class="text-light">Agendamentos</a>
      </div>
    </div>
  </nav>

  <h1>Estilos de tatuagem</h1>
  <p class="text-muted">
    Cadastre, consulte, edite e exclua os estilos oferecidos pelo estúdio.
  </p>

  <form id="form-estilo" class="row g-2 mt-3 mb-4">
    <div class="col-md-6">
      <label for="descricao" class="form-label">Descrição do estilo</label>
      <input
        type="text"
        id="descricao"
        class="form-control"
        placeholder="Ex.: Blackwork"
        required
      >
    </div>

    <div class="col-md-3 d-flex align-items-end">
      <button
        id="btn-submit-estilo"
        type="submit"
        class="btn btn-primary w-100"
      >
        Cadastrar
      </button>
    </div>

    <div class="col-md-3 d-flex align-items-end">
      <button
        type="button"
        class="btn btn-secondary w-100"
        onclick="limparFormulario()"
      >
        Limpar
      </button>
    </div>
  </form>

  <h2 class="h4">Estilos cadastrados</h2>

  <div class="table-responsive">
    <table class="table table-bordered table-striped align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Descrição</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody id="corpo-tabela">
      </tbody>
    </table>
  </div>

  <script src="js/estilos.js"></script>

</body>
</html>
