
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos — Estúdio de Tatuagem</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Estúdio de Tatuagem</span>

            <div>
                <a href="clientes.html" class="text-light me-3">Clientes</a>
                <a href="senioridade.html" class="text-light me-3">Senioridade</a>
                <a href="estilos.html" class="text-light me-3">Estilos</a>
                <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
                <a href="agendamentos.html" class="text-light me-3">Agendamentos</a>

                <button
                    type="button"
                    class="btn btn-outline-light btn-sm"
                    onclick="sair()"
                >
                    Sair
                </button>
            </div>
        </div>
    </nav>

    <div class="container">

        <h1 class="mb-4">Agendamentos</h1>

        <form id="form-agendamento" enctype="multipart/form-data">

            <div class="mb-3">
                <label for="idcliente" class="form-label">Cliente</label>
                <select id="idcliente" class="form-select" required>
                    <option value="">Cliente...</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="idtatuador" class="form-label">Tatuador</label>
                <select id="idtatuador" class="form-select" required>
                    <option value="">Tatuador...</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="dataagendamento" class="form-label">Data</label>
                <input
                    type="date"
                    id="dataagendamento"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="horaagendamento" class="form-label">Hora</label>
                <input
                    type="time"
                    id="horaagendamento"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="valortatuagem" class="form-label">Valor</label>
                <input
                    type="number"
                    step="0.01"
                    id="valortatuagem"
                    class="form-control"
                >
            </div>

            <div class="mb-3">
                <label for="descricaotatuagem" class="form-label">
                    Descrição da tatuagem
                </label>

                <textarea
                    id="descricaotatuagem"
                    class="form-control"
                    rows="3"
                ></textarea>
            </div>

            <div class="mb-3">
                <label for="desenho" class="form-label">
                    Desenho aprovado (imagem)
                </label>

                <input
                    type="file"
                    id="desenho"
                    class="form-control"
                    accept="image/*"
                >
            </div>

            <div class="mb-3" id="bloco-status" style="display: none;">
                <label for="status" class="form-label">Status</label>

                <select id="status" class="form-select">
                    <option value="pendente">Pendente</option>
                    <option value="confirmado">Confirmado</option>
                    <option value="concluido">Concluído</option>
                    <option value="cancelado">Cancelado</option>
                </select>
            </div>

            <button
                type="submit"
                id="btn-submit-agendamento"
                class="btn btn-primary"
            >
                Cadastrar
            </button>

        </form>

        <hr class="my-4">

        <h2>Lista de Agendamentos</h2>

        <div class="table-responsive">
            <table class="table table-bordered table-striped mt-3">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Tatuador</th>
                        <th>Data</th>
                        <th>Hora</th>
                        <th>Valor</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="corpo-tabela"></tbody>

            </table>
        </div>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/agendamentos.js"></script>

    <script>
        protegerPagina();
    </script>

</body>
</html>
