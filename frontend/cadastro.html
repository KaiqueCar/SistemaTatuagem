
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo funcionário | Ink Studio</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: #101010;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .cadastro-card {
            width: 100%;
            max-width: 460px;
            padding: 36px;
            background: #191919;
            border: 1px solid #303030;
            border-radius: 16px;
        }

        .logo {
            color: #fff;
            font-weight: bold;
            letter-spacing: 3px;
            font-size: 1.5rem;
        }

        .destaque {
            color: #e63946;
        }

        .subtitulo {
            color: #aaa;
        }

        .form-control {
            background: #101010;
            color: white;
            border: 1px solid #444;
            padding: 12px;
        }

        .form-control:focus {
            background: #101010;
            color: white;
            border-color: #e63946;
            box-shadow: 0 0 0 0.2rem rgba(230, 57, 70, .2);
        }

        .form-control::placeholder {
            color: #999;
        }

        .btn-cadastrar {
            background: #e63946;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
        }

        .btn-cadastrar:hover {
            background: #c92d3a;
            color: white;
        }

        a {
            color: #ff6b75;
        }

        #mensagem {
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <main class="cadastro-card">
        <div class="text-center mb-4">
            <a href="dashboard.html" class="logo text-decoration-none">
                INK<span class="destaque">.</span>STUDIO
            </a>

            <h1 class="h3 mt-4">Novo funcionário</h1>
            <p class="subtitulo">
                Preencha os dados para cadastrar um funcionário no sistema.
            </p>
        </div>

        <form id="form-cadastro">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    class="form-control"
                    placeholder="Digite o nome completo"
                    maxlength="100"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="funcionario@exemplo.com"
                    maxlength="150"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label">Senha</label>
                <input
                    type="password"
                    id="senha"
                    class="form-control"
                    placeholder="Crie uma senha"
                    autocomplete="new-password"
                    required
                >
                <small class="subtitulo">
                    Escolha uma senha forte e não a compartilhe.
                </small>
            </div>

            <button
                type="submit"
                id="botao-cadastrar"
                class="btn btn-cadastrar w-100"
            >
                Cadastrar funcionário
            </button>

            <p
                id="mensagem"
                class="mt-3 mb-0 text-center"
                role="status"
                aria-live="polite"
            ></p>
        </form>

        <p class="text-center mt-4 mb-0">
            <a href="dashboard.html">Voltar ao painel</a>
        </p>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
