```html
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Tatuadores — Estúdio de Tatuagem</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="container py-4">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Estúdio de Tatuagem</span>

            <div>
                <a href="clientes.html" class="text-light me-3">Clientes</a>
                <a href="senioridade.html" class="text-light me-3">Senioridade</a>
                <a href="estilos.html" class="text-light me-3">Estilos</a>
                <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
                <a href="agendamentos.html" class="text-light">Agendamentos</a>
            </div>
        </div>
    </nav>

    <h1>Tatuadores</h1>

    <form id="form-tatuador" class="row g-3 mt-2 mb-4">

        <div class="col-md-4">
            <input
                type="text"
                id="nometatuador"
                class="form-control"
                placeholder="Nome do tatuador"
                required
            >
        </div>

        <div class="col-md-3">
            <input
                type="text"
                id="cpf"
                class="form-control"
                placeholder="CPF"
                required
            >
        </div>

        <div class="col-md-3">
            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="E-mail"
            >
        </div>

        <div class="col-md-3">
            <input
                type="text"
                id="telefone"
                class="form-control"
                placeholder="Telefone"
            >
        </div>

        <div class="col-md-3">
            <select id="idsenioridade" class="form-select" required>
                <option value="">Senioridade...</option>
            </select>
        </div>

        <div class="col-12">
            <label class="form-label fw-bold">
                Estilos que domina
            </label>

            <div
                id="lista-estilos"
                class="d-flex flex-wrap gap-3"
            >
                <span class="text-muted">Carregando estilos...</span>
            </div>
        </div>

        <div class="col-md-3">
            <button
                id="btn-submit-tatuador"
                type="submit"
                class="btn btn-primary w-100"
            >
                Cadastrar
            </button>
        </div>

    </form>

    <h2 class="h4">Tatuadores cadastrados</h2>

    <div class="table-responsive">
        <table class="table table-bordered table-striped">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                    <th>Senioridade</th>
                    <th>Estilos</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="corpo-tabela"></tbody>

        </table>
    </div>

    <script src="js/tatuadores.js"></script>

</body>

</html>
```
